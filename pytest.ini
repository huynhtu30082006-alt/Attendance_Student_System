[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = source
testpaths = source/tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Core smoke tests
    auth: Authentication tests
    rbac: Role-based access control tests
    privacy: Data privacy tests
    admin: Admin module tests
    accounts: Account management tests
    courses: Course management tests
    classrooms: Classroom management tests
    sessions: Session management tests
    settings: Threshold settings tests
    teacher: Teacher module tests
    student: Student module tests
    attendance: Attendance taking & lifecycle tests
    reports: Reports & export tests
    nfr: Non-functional requirement tests
    usability: NFR Usability tests
    reliability: NFR Reliability tests
    performance: NFR Performance tests
    security: NFR Security tests
    boundary: Boundary value tests
    deploy: Deployment tests
    manual: Manual GUI/UX walkthrough tests
    infra: Infrastructure / Docker / Load tests
    process: Process / external tracker inspection tests
    slow: Slower performance / large-dataset tests
    ui: UI / modal interaction tests
