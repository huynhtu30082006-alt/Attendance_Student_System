{# Shared confirm modal (POST + CSRF). Add to a button: data-confirm-url data-confirm-title data-confirm-body data-confirm-label [data-confirm-style="primary"] #}
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-role="title">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="post" action="">
        {% csrf_token %}
        <div class="modal-body" data-role="body">Are you sure?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger" data-role="ok">Confirm</button>
        </div>
      </form>
    </div>
  </div>
</div>
