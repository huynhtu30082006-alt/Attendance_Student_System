{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mb-3"><h1 class="page-title">{{ title }}</h1></div>
<div class="card-panel" style="max-width:640px">
  <p class="mb-4">{{ message }}</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn {% if 'Lock' in title or 'Delete' in title %}btn-danger{% else %}btn-brand{% endif %}">{{ button }}</button>
    <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Go back</a>
  </form>
</div>
{% endblock %}
